name: Auto Discover Ports

on:
  schedule:
    # Executa diariamente às 03:00 de Brasília (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite disparo manual com 1 clique pela aba Actions do GitHub

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Executar Varredura de Novos Ports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover-ports.js --append

      - name: Criar Pull Request com Novos Ports
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat: novos ports nativos descobertos automaticamente'
          title: '🤖 Novos Ports Nativos Descobertos pelo SSLabs Scanner'
          body: |
            Varredura automática diária de novos ports nativos, decompilações e recompilações estáticas no GitHub.
            
            Verifique o arquivo `novos_ports_sugeridos.json` para conferir a lista de projetos adicionados.
          branch: auto-discover-ports
          base: main
