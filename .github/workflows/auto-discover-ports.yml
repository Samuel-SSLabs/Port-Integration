name: Auto Discover Ports

on:
  schedule:
    # Executa diariamente às 03:00 de Brasília (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      action_mode:
        description: 'Modo de Operação'
        required: true
        default: 'discover_and_code'
        type: choice
        options:
          - 'discover_and_code'
          - 'enrich_codes_only'

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Executar Varredura e Busca de Códigos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.action_mode }}" = "enrich_codes_only" ]; then
            node scripts/discover-ports.js --enrich-codes
          else
            node scripts/discover-ports.js --append
          fi

      - name: Criar Pull Request com Novos Ports
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat: novos ports nativos descobertos automaticamente'
          title: '🤖 Novos Ports Nativos Descobertos pelo SSLabs Scanner'
          body: |
            Varredura automática diária de novos ports nativos, decompilações e recompilações estáticas no GitHub.
            
            Verifique o arquivo `novos_ports_sugeridos.json` para conferir a lista de projetos adicionados.
          branch: auto-discover-ports
          base: main
