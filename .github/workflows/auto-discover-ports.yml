name: Auto Discover Ports

on:
  schedule:
    # Executa diariamente às 03:00 da manhã (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite disparo manual com 1 clique no GitHub Actions

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar Varredura de Novos Ports
        run: node scripts/discover-ports.js --append

      - name: Criar Pull Request com Novos Ports
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'feat: novos ports nativos descobertos automaticamente'
          title: '🤖 Novos Ports Nativos Descobertos pelo SSLabs Scanner'
          body: |
            Varredura automática semanal de novos ports nativos, decompilações e recompilações estáticas no GitHub.
            
            Verifique o arquivo `novos_ports_sugeridos.json` para conferir a lista de projetos adicionados.
          branch: auto-discover-ports
          base: main
