name: Processar Fila de Ports (Cloud Manager)

on:
  workflow_dispatch:
    inputs:
      repos_batch:
        description: 'Lista de repositórios para processar (JSON ou separados por vírgula)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  process_queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Processar Fila de Ports e Gerar Capas (WebP + AVIF)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/adicionar-port.js --batch '${{ inputs.repos_batch }}'

      - name: Commit e Push das Modificações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add app.js assets/covers/ locales.js
            git commit -m "feat(auto): novos ports adicionados via Cloud Manager [skip ci]"
            git push origin main
            echo "Ports adicionados e publicados na main com sucesso!"
          else
            echo "Nenhuma modificação gerada."
          fi
