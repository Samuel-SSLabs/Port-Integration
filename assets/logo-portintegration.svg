<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700&amp;display=swap');
      .title-port {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 34px;
        fill: #FFFFFF;
        letter-spacing: -0.02em;
      }
      .title-integration {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 34px;
        fill: #a78bfa;
        letter-spacing: -0.02em;
      }
      .subtitle {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13.5px;
        fill: #94a3b8;
        letter-spacing: 0.12em;
      }
    </style>
  </defs>

  <!-- Logo SSLabs Oficial -->
  <image href="data:image/png;base64," x="16" y="24" height="52" width="auto" preserveAspectRatio="xMidYMid meet" />

  <!-- Texto PortIntegration -->
  <text x="250" y="55" class="title-port">Port<tspan class="title-integration">Integration</tspan></text>
  
  <!-- Subtítulo PC NATIVE PORTS HUB -->
  <text x="252" y="75" class="subtitle">PC NATIVE PORTS HUB</text>
</svg>
